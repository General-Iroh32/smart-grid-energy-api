services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smartgrid
      POSTGRES_USER: smartgrid
      POSTGRES_PASSWORD: smartgrid
    ports:
      - "5432:5432"
    volumes:
      - smartgrid-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartgrid -d smartgrid"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/smartgrid
      DATABASE_USERNAME: smartgrid
      DATABASE_PASSWORD: smartgrid
      SPRING_PROFILES_ACTIVE: demo
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend


volumes:
  smartgrid-data:
